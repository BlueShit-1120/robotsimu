# 内环敏感性扫描变体（.scratch/inner-loop-sweep/SWEEP-2.md）：在 cnc_v3 之上只改 box_feeding_max_angular_speed 0.04 → 0.02。
# 想回答的问题：角速上限从 0.04 再减半到 0.02 目标量还改善不改善（新内环角向是比例让步，上限只在饱和时起作用）。其余逐键与 cnc_v3 相同，勿单独调。
# cnc-v3-paired 被测档
# v3 终止逻辑全开（接触线切调节相 + 二次确认压）。趋近相以 8mm/s 前馈行进（首撞预算 15 N ÷ 实测 1.8 N 每 mm/s）→
# 法向反力单帧过 3.5N 接触线切调节相（前馈 0、期望力 3.5N、让步速度 = 力误差/D）；settle 候选后微抬 3mm 再压回比对停点。
# 配对 suite cnc_v3 / cnc_v3_aligned / smoke_cnc 用。
# 来源：ros2_ws main 的 config/right_arm/ 四文件拼接（node / calibration / workpiece_insert 取 main，
# 标定含 main 新的静止就绪判定参数，对应 rebase 到 main 之后的 v3 二进制）+ box_feeding 段取 v3 分支
# 39cd319 作者档。与作者档唯一的存量差：settle_shortfall_max 0.008 → 0.025——真机实走 35–43mm 对
# 50mm goal 欠 7–15mm，作者档 8mm 门在真机上就是被手动放宽的那一项。
# 三份档只差：max_linear_speed / box_feeding_approach_speed / box_feeding_probe_lift。改存量键要三份一起改，别只改一份。
# 参数面 = realman ADR 0013（feat/admittance-inner-loop c026a1d，内环速度态单积分 + 两相趋近）：D 1000 / D_ang 20 / 角速上限 0.04 /
# 力矩上限 2.0 / 力矩死区 0.1（后两者参考点力矩口径）/ 让步上限 max_speed 0.016；fast/crawl/decel/reverse_clamp/stiffness/lpf/smoothing 键已删或改名。
# 接触面参考点 tool_contact_ref_xyz [0.025, 0.024, 0.238]（传感器系，m）= lever_fit2.py 对两侧 solref 0.01 的 CNC 场景 15 组接触段拟合
# （smoke_cnc_0908_1549 / sweep_cnc_solref10ms_v3_0908_1429 / sweep_cnc_solref10ms_angular004_0908_1428）：L 取 Mx~Fy 中位（R² 0.998），
# y0 取 Mx~Fz 中位，x0 取 My~Fz 0.035 与 Mz~Fy 0.016 两路中位的均值（两路 R² 0.35～0.45，x0 不确定 ±0.02）。
/**:
  ros__parameters:
    # ---- node.yaml ----
    # 右臂力控节点：节点级参数（臂身份、力处理、运动限制、传感器）
    # 标定 / WorkpieceInsert / BoxFeeding 参数见同目录其余三个文件；launch 一并加载，键不得重复
    # ---- 臂身份 ----
    arm_id: right_arm
    # 共享内存索引：左臂=1，右臂=2
    shm_index: 2
    # IK SDK配置文件（相对 realman_force_demo/config）
    marvin_kine_config_file: ccs_m6.MvKDCfg
    # ---- 力处理：卡尔曼 / 死区 ----
    kalman_process_noise: 0.01
    kalman_measurement_noise: 0.1
    # 力死区阈值（N），绝对值小于此值时输出0
    force_deadzone: 1.0
    # 力矩死区阈值（N·m，接触面参考点力矩），绝对值小于此值时输出0
    moment_deadzone: 0.1
    # ---- 工具系：接触面参考点 ----
    # 传感器系下的 (x0, y0, L)，m：力矩换算到这一点，姿态让步的转动中心也在这一点；未配置时工具系退回传感器系，启动 WARN 一次。
    # sim 值 = lever_fit2.py 对本仓 suite 接触日志的三参数拟合（M = p × F，L 取 Mx~Fy 路线），拟合明细见档头。
    tool_contact_ref_xyz: [0.025, 0.024, 0.238]
    # ---- 运动限制 ----
    # 控制周期步长（秒），0.001=1ms(1000Hz)
    control_time: 0.001
    # 导纳让步速度上限（安全封顶，正反同值）；0.0 = 用代码默认 0.016 m/s / 0.1 rad/s
    # 最大线速度 (m/s)，0.0=使用代码默认值（2cm/s，频率自适应）；例如 0.02 = 2cm/s
    max_linear_speed: 0.007
    # 最大角速度 (rad/s)，例如 0.05 = 0.05rad/s
    max_angular_speed: 0.0
    # 关节突变保护阈值（rad），任一关节超阈值将拒绝下发
    joint_jump_threshold_rad: 0.1
    # ---- 传感器 ----
    # 是否从共享内存读关节/六维力并发布力话题
    kunwei_sensor_enabled: true
    # 力传感器数据发布间隔（毫秒），1ms=1000Hz
    force_sensor_publish_interval_ms: 1
    # ---- calibration.yaml ----
    # 右臂力传感器标定（sensor_calibration action）参数
    # 校准参数文件目录路径
    calibration_directory: /opt/spiderrobot/public/forcesensor_calibration
    # 标定"静止就绪"判定：进入指令目标粗邻域后，关节角、力、力矩在同一时间窗内
    # 的峰峰值都低于阈值即开始采样，不再固定静置；速度与超时不接受调用方输入
    # 标定 MOVEJ 固定速度（单位随 eth 侧，与旧默认一致）
    calibration_move_speed: 20.0
    # 粗邻域：与指令目标的最大关节误差上限（rad，约 2.9°）
    calibration_arrival_enter_tolerance_rad: 0.05
    # 静止窗长（s）
    calibration_stability_hold_seconds: 1.0
    # 每点保护超时（s），含移动与震荡衰减
    calibration_arrival_timeout_seconds: 30.0
    # 窗内关节角峰峰值上限（rad）
    calibration_stationary_joint_range_rad: 0.0005
    # 窗内力峰峰值上限（N），静止噪声约 0.26
    calibration_stationary_force_range_n: 0.5
    # 窗内力矩峰峰值上限（N·m），静止噪声约 0.009
    calibration_stationary_moment_range_nm: 0.02
    # ---- workpiece_insert.yaml ----
    # 右臂 WorkpieceInsert action 默认参数（节点启动时加载）
    # 命令行只需指定 search_axis / debug_mode，其余从此处加载
    # 插入轴（0=TOOL_X, 1=TOOL_Y, 2=TOOL_Z）
    workpiece_insert_insertion_axis: 2
    # 目标插入法向力（N，正值）
    workpiece_insert_target_normal_force: 5.0
    # 导纳质量参数（kg）
    workpiece_insert_mass: 1.0
    # 导纳阻尼参数（N·s/m）
    workpiece_insert_damping: 50.0
    # 导纳刚度参数（N/m）
    workpiece_insert_stiffness: 0.0
    # 正弦搜索幅值 (m)
    workpiece_insert_search_amplitude: 0.008
    # 正弦搜索频率 (Hz)，0.5Hz = 2秒一个周期
    workpiece_insert_search_frequency: 0.5
    # 接触检测力阈值（N）
    workpiece_insert_contact_force_threshold: 2.0
    # 掉入判定：位移突增量（m）
    workpiece_insert_drop_in_displacement_threshold: 0.003
    # 掉入判定：最小有效插入深度（m）
    workpiece_insert_min_insertion_depth: 0.005
    # 下压速度（m/s），建议 0.005~0.02
    workpiece_insert_descent_speed: 0.008
    # 最大允许合力（N），超出立即中止
    workpiece_insert_force_limit: 20.0
    # 总超时时间（s）
    workpiece_insert_timeout: 30.0
    # 最大允许插入位移（m），防止过插入
    workpiece_insert_max_displacement: 0.05
    # 掉入稳定阶段搜索轴力保护阈值（N），超出立即停止横向运动
    workpiece_insert_settle_search_force_limit: 5.0
    # 下压安全限位下界（m）
    workpiece_insert_descent_threshold_min: 0.005
    # 下压安全限位上界（m）；target_pose 超出此值时 clamp
    workpiece_insert_descent_threshold_max: 0.08
    # ---- box_feeding.yaml（参数面 = realman ADR 0013）----
    # BoxFeeding 导纳控制参数
    # 导纳期望力（N）
    box_feeding_target_force: 3.5
    # 单轴超力保护阈值（N）；合力阈值 = × 1.5
    box_feeding_force_limit: 30.0
    # 导纳虚拟质量（kg），xyz 三平移轴同值；与 D 一起只定滤波常数 τ=M/D
    box_feeding_mass: 1.0
    # 导纳虚拟阻尼（N·s/m），xyz 三平移轴同值：稳态让步速度 = 力误差/D，唯一的调节旋钮
    box_feeding_damping: 1000.0
    # 全局超时（s），0 = 不限时
    box_feeding_timeout: 60.0
    # 完成阈值下界（m）
    box_feeding_threshold_min: 0.005
    # 完成阈值上界（m）；target_pose 超出此值时 clamp
    box_feeding_threshold_max: 0.15
    # 接触稳定完成（contact settle）：窗均法向反力达标+停滞+位置合理 → 提前判成功；调参见 docs/box-feeding-termination.md
    # 力达标比例 k（窗均法向反力 ≥ k×|法向期望力|）；0=禁用接触稳定路径；勿设≥1（稳态力≈target，永不触发）
    box_feeding_settle_force_ratio: 0.8
    # 滑动窗 T（s）；ε/T=允许蠕进速度才是真旋钮；窗均抗极限环振荡（见 ADR 0004）；0=禁用；加载夹到 [0,5]s
    box_feeding_settle_window: 1.0
    # 停滞容差 ε（m）：窗内 move_dist 跨度上限；ε/T=2mm/s（v3 拍板，probe 承担卡点甄别后可放宽）
    box_feeding_settle_stall_eps: 0.002
    # 行进合理区间（m）：位置门槛只参与 probe 后的结论解释（v3），不再拦入口；0=不设门槛
    box_feeding_settle_shortfall_max: 0.025
    # 疑似卡滞计时（s），仅 probe_lift=0 的旧行为生效；probe 启用时 jam 由停点比对即时出结论；0=等超时
    box_feeding_jam_abort_duration: 5.0
    # 过界余量（m）：settle 启用时走到 threshold+此值仍未接触稳定 → abort 报 overtravel（=goal 给浅的信号）；settle 禁用时无效
    box_feeding_overtravel: 0.02
    # 两相趋近：趋近相按 approach_speed 前馈行进、期望力 0；法向反力单帧瞬时越过 contact_force_line → 调节相：前馈 0、期望力生效、速度 = 力误差/D
    # 趋近前馈速度（m/s）：趋近相按它匀速行进、期望力 0，与 D 无关；首撞峰值随它线性（真机约 1.8 N 每 mm/s，预算 15 N → 8 mm/s）；0=回退节点级 max_linear_speed
    box_feeding_approach_speed: 0.008
    # 接触线（N，单帧瞬时判）：趋近相法向反力越线即切调节相（前馈 0、期望力生效、让步速度 = 力误差/D），单向锁存；≈期望力（行进段单帧噪声 p95≈3.7N，放低会中途误触发损节拍）；0=禁用两相，全程调节相
    box_feeding_contact_force_line: 3.5
    # 让步速度安全上限（m/s，正反同值）：只封顶导纳的退让/压进速度，不含趋近前馈；正常工作不该碰到
    box_feeding_max_speed: 0.016
    # v3 二次确认压 re-seat probe：settle 力+停滞候选后微抬再压回，比对两次停点定成败
    # 微抬量（m）；0=禁用 probe，回退 jam 计时旧行为
    box_feeding_probe_lift: 0.003
    # 停点一致容差（m），窗均口径（瞬时噪声 ±1mm 级不可用）
    box_feeding_probe_tol: 0.0005
    # 变深重压循环上限，超过判 jam（持续滑移异常）
    box_feeding_probe_max_repress: 2
    # 抬升段拉力线（N）：法向拉力超此值=被钩挂→jam
    box_feeding_probe_hook_pull: 10.0
    # mode 39/40 姿态柔顺（roll/pitch 被动让步）专属参数；纯位置模式(7 等)不选这些轴，无影响
    # 旋转轴被动柔顺虚拟质量
    box_feeding_mass_angular: 0.2
    # 旋转轴被动柔顺虚拟阻尼（N·m·s/rad，参考点力矩口径）：让步角速 = 力矩/D_ang；调大更慢/更硬
    box_feeding_damping_angular: 20.0
    # 旋转轴角速安全上限（rad/s），比例让步到此封顶；0=用代码默认 0.1
    box_feeding_max_angular_speed: 0.02
    # 力矩超限保护阈值（N·m，接触面参考点力矩；真机 155 组接触段峰值 p90 0.85、最大 1.06），仅姿态柔顺模式(39/40)生效
    box_feeding_moment_limit: 2.0
