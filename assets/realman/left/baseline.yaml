# 左臂交互式起臂用的基线档：上游 ros2_ws config/left_arm 四文件的拼接副本，box_feeding 两相键取上游值、无 probe 键组（probe_lift 缺省 0 = jam 计时）。
# 参数面 = realman ADR 0013（feat/admittance-inner-loop c026a1d，内环速度态单积分 + 两相趋近）：D 1000 / D_ang 20 / 角速上限 0.04 /
# 力矩上限 2.0 / 力矩死区 0.1（后两者参考点力矩口径）/ 让步上限 max_speed 0.016；fast/crawl/decel/reverse_clamp/stiffness/lpf/smoothing 键已删或改名。
# 接触面参考点 tool_contact_ref_xyz 未配置：sim 左臂没有接触日志可拟合（同上游左臂档，待数据），节点启动 WARN 一次、工具系退回传感器系。
/**:
  ros__parameters:
    # 臂ID配置
    arm_id: "left_arm"
    shm_index: 1  # 共享内存索引：左臂=1，右臂=2
    marvin_kine_config_file: "ccs_m6.MvKDCfg"  # IK SDK配置文件（相对 realman_force_demo/config）
    
    # 卡尔曼滤波器参数
    kalman_process_noise: 0.01
    kalman_measurement_noise: 0.1
    force_deadzone: 1.5   # 力死区阈值（N），绝对值小于此值时输出0
    moment_deadzone: 0.1  # 力矩死区阈值（N·m，接触面参考点力矩），绝对值小于此值时输出0
    # ---- 工具系：接触面参考点 ----
    # 传感器系下的 (x0, y0, L)，m：力矩换算到这一点，姿态让步的转动中心也在这一点；未配置时工具系退回传感器系，启动 WARN 一次。
    # sim 左臂没有接触日志可拟合，暂不配置（同上游左臂档，待数据）。
    # tool_contact_ref_xyz: [0.0, 0.0, 0.0]
    
    control_time: 0.001  # 控制周期步长（秒），0.001=1ms(1000Hz)
    # 导纳让步速度上限（安全封顶，正反同值）；0.0 = 用代码默认 0.016 m/s / 0.1 rad/s
    max_linear_speed: 0.0056   # 最大线速度 (m/s)，0.0=使用代码默认值（2cm/s，频率自适应）；例如 0.02 = 2cm/s
    max_angular_speed: 0.0  # 最大角速度 (rad/s)，例如 0.05 = 0.05rad/s
    joint_jump_threshold_rad: 0.1  # 关节突变保护阈值（rad），任一关节超阈值将拒绝下发
    
    # 是否从共享内存读关节/六维力并发布力话题
    kunwei_sensor_enabled: true
    force_sensor_publish_interval_ms: 1  # 力传感器数据发布间隔（毫秒），1ms=1000Hz
    
    # 校准参数文件路径
    calibration_directory: "/opt/spiderrobot/public/forcesensor_calibration"  # 校准参数文件目录路径
    # 校准到位稳定判定参数（用于 sensor_calibration）
    calibration_arrival_enter_tolerance_rad: 0.012   # 进入到位区阈值（rad）
    calibration_arrival_stable_tolerance_rad: 0.0025 # 稳定阈值（rad）
    calibration_stable_delta_threshold_rad: 0.0008   # 相邻采样最大关节增量阈值（rad）
    calibration_stability_hold_seconds: 1.0          # 满足稳定条件后需持续时间（s）
    calibration_arrival_timeout_seconds: 20.0        # 到位稳定判定超时（s）

    # ------------------------------------------------------------------
    # WorkpieceInsert action 默认参数（节点启动时加载）
    # 命令行只需指定 search_axis / debug_mode，其余从此处加载
    # ------------------------------------------------------------------
    workpiece_insert_insertion_axis: 2              # 插入轴（0=TOOL_X, 1=TOOL_Y, 2=TOOL_Z）
    workpiece_insert_target_normal_force: 5.0       # 目标插入法向力（N，正值）
    workpiece_insert_mass: 1.0                      # 导纳质量参数（kg）
    workpiece_insert_damping: 50.0                  # 导纳阻尼参数（N·s/m）
    workpiece_insert_stiffness: 0.0                 # 导纳刚度参数（N/m）
    workpiece_insert_search_amplitude: 0.008        # 正弦搜索幅值 (m)
    workpiece_insert_search_frequency: 0.5          # 正弦搜索频率 (Hz)，0.5Hz = 2秒一个周期
    workpiece_insert_contact_force_threshold: 2.0   # 接触检测力阈值（N）
    workpiece_insert_drop_in_displacement_threshold: 0.003  # 掉入判定：位移突增量（m）
    workpiece_insert_min_insertion_depth: 0.005     # 掉入判定：最小有效插入深度（m）
    workpiece_insert_descent_speed: 0.008           # 下压速度（m/s），建议 0.005~0.02
    workpiece_insert_force_limit: 20.0              # 最大允许合力（N），超出立即中止
    workpiece_insert_timeout: 30.0                  # 总超时时间（s）
    workpiece_insert_max_displacement: 0.05         # 最大允许插入位移（m），防止过插入
    workpiece_insert_settle_search_force_limit: 5.0 # 掉入稳定阶段搜索轴力保护阈值（N），超出立即停止横向运动
    workpiece_insert_descent_threshold_min: 0.005   # 下压安全限位下界（m）
    workpiece_insert_descent_threshold_max: 0.15    # 下压安全限位上界（m）；target_pose 超出此值时 clamp

    # BoxFeeding 导纳控制参数
    box_feeding_target_force: 3.5    # 导纳期望力（N）
    box_feeding_force_limit: 30.0    # 单轴超力保护阈值（N）；合力阈值 = × 1.5
    box_feeding_mass: 1.0            # 导纳虚拟质量（kg），xyz 三平移轴同值；与 D 一起只定滤波常数 τ=M/D
    box_feeding_damping: 1000.0      # 导纳虚拟阻尼（N·s/m），xyz 三平移轴同值：稳态让步速度 = 力误差/D，唯一的调节旋钮
    box_feeding_timeout: 60.0        # 全局超时（s），0 = 不限时
    box_feeding_threshold_min: 0.005  # 完成阈值下界（m）
    box_feeding_threshold_max: 0.15   # 完成阈值上界（m）；target_pose 超出此值时 clamp
    # 接触稳定完成（contact settle）：窗均法向反力达标+停滞+位置合理 → 提前判成功；调参见 docs/box-feeding-termination.md
    box_feeding_settle_force_ratio: 0.8       # 力达标比例 k（窗均法向反力 ≥ k×|法向期望力|）；0=禁用接触稳定路径；勿设≥1（稳态力≈target，永不触发）
    box_feeding_settle_window: 1.0            # 滑动窗 T（s）；ε/T=允许蠕进速度才是真旋钮；窗均抗极限环振荡（见 ADR 0004）；0=禁用；加载夹到 [0,5]s
    box_feeding_settle_stall_eps: 0.0005      # 停滞容差 ε（m）：窗内 move_dist 跨度上限；ε/T=0.5mm/s（两孔任务第一孔蠕进 0.9mm/s 被拦）
    box_feeding_settle_shortfall_max: 0.005   # 行进合理区间（m）：拦"假静止"的关键门槛（实测第一孔平台距阈值 7.5mm）；0=不设门槛
    box_feeding_jam_abort_duration: 5.0       # 疑似卡滞持续此时长提前 abort 报 suspected_jam（s）=感知偏深或真卡滞；合法中途停滞实测最长 1.1s；0=等超时
    box_feeding_overtravel: 0.01              # 过界余量（m）：settle 启用时走到 threshold+此值仍未接触稳定 → abort 报 overtravel（=goal 给浅的信号）；settle 禁用时无效
    # 两相趋近：趋近相按 approach_speed 前馈行进、期望力 0；法向反力单帧瞬时越过 contact_force_line → 调节相：前馈 0、期望力生效、速度 = 力误差/D
    box_feeding_approach_speed: 0.0056               # 趋近前馈速度（m/s）：趋近相按它匀速行进、期望力 0，与 D 无关；首撞峰值随它线性（真机约 1.8 N 每 mm/s，预算 15 N → 8 mm/s）；0=回退节点级 max_linear_speed
    box_feeding_contact_force_line: 3.5   # 接触线（N，单帧瞬时判）：趋近相法向反力越线即切调节相（前馈 0、期望力生效、让步速度 = 力误差/D），单向锁存；≈期望力（行进段单帧噪声 p95≈3.7N，放低会中途误触发损节拍）；0=禁用两相，全程调节相
    box_feeding_max_speed: 0.016              # 让步速度安全上限（m/s，正反同值）：只封顶导纳的退让/压进速度，不含趋近前馈；正常工作不该碰到
    # mode 39/40 姿态柔顺（roll/pitch 被动让步）专属参数；纯位置模式(7 等)不选这些轴，无影响
    box_feeding_mass_angular: 0.2        # 旋转轴被动柔顺虚拟质量
    box_feeding_damping_angular: 20.0    # 旋转轴被动柔顺虚拟阻尼（N·m·s/rad，参考点力矩口径）：让步角速 = 力矩/D_ang；调大更慢/更硬
    box_feeding_max_angular_speed: 0.04  # 旋转轴角速安全上限（rad/s），比例让步到此封顶；0=用代码默认 0.1
    box_feeding_moment_limit: 2.0        # 力矩超限保护阈值（N·m，接触面参考点力矩；真机 155 组接触段峰值 p90 0.85、最大 1.06），仅姿态柔顺模式(39/40)生效
