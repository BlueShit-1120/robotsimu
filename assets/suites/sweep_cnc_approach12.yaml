notes: |
  首撞斜率点（.scratch/inner-loop-sweep/INNER-LOOP-GATES.md）：布局同 smoke_cnc，只换档 cnc_v3_approach12（趋近前馈 12 mm/s）。
  与 smoke_cnc（8 mm/s）两点定首撞峰值对趋近速度的斜率；预期峰约 1.85 N 每 mm/s × 12 ≈ 22 N，仍在 30 N 上限内。
  行程算术（standoff 50）：+11 = 真机实走 39mm 的中位工况，门内 → settled 且 depth_delta ≈ −11；
  +30 停在 ≈20mm、欠 30 > 25mm 门 → jam(gate_out)；−30 所需 80mm 过 70mm 过界线 → overtravel。
  offset 0 那组人眼看过即是配对批 compare_runs 的 --seated-ref。

  contact_debug: true —— 6 组体量可控；出问题时接触对（谁碰了谁、穿透多深）比力曲线直接
