notes: |
  cnc-v3-paired 配对批之一（CONTEXT「paired suites」）：cnc_old7 / cnc_old16 / cnc_v3 三份除 realman_yaml
  与 expect.params 外逐字相同、同 seed，第 n 组采样逐字一致，compare_runs.py 按组号对表。
  噪声 = 真机观察复刻：goal 距起手位 50mm 而实走 35–43mm → 偏深 uniform [7, 15]；
  起手位横向 2–5mm、姿态 1–3° 不手调 → sigma_pos 2.5 / sigma_rot 1.5（逐轴高斯）。
  销尖导角 + 孔口倒角的几何捕获半径约 3mm：横向 ≤3 靠导角进、3–5 靠 mode 40 柔顺，进不去须判 jam。
  不断言结局（分布连续、物理上一部分本就该进不去）；只钉参数生效与零严重错误。
motion: cnc
realman_yaml: cnc_old16
episodes: 50
seed: 42
description: CNC 配对 · 旧终止逻辑（jam 计时）· 趋近 16mm/s 撞底
overrides:
  force:
    sigma_pos: 2.5
    sigma_rot: 1.5
    goal_depth_offset_mm:
      uniform: [7, 15]
expect:
  probe_events: false
  zero_severe: true
  params:
    max_linear_speed: 0.016
    box_feeding_approach_speed: 0.016
    box_feeding_contact_force_line: 3.5
    box_feeding_damping: 1000.0
    box_feeding_probe_lift: 0.0
    box_feeding_settle_shortfall_max: 0.025
