notes: |
  v3 验收 A：平底料箱压实。goal 三档验「准→成功 / 浅→过界 / 深→成功且上报欠行程」，
  σ 5mm/1° 覆盖感知噪声敏感性（B/C 刻意不带噪声，靠这一份覆盖）。

  档位按两轮百组实测定（行程算术：触底所需行程 = 40mm 完成距离 − 档位 − 感知噪声）：
  过界线 = 40 + 过界余量，本档余量 20mm 故线在 60mm。浅档要稳判过界且停在悬空带（>10mm），
  需触底所需行程比线高出 3σ 有余 → 档位 −45（间隙 25 ± 5mm，落灰带概率 0.13%）。
  余量还是 5mm 时 −20 就够，抬到 20mm 后 −20 有一半会触底，那档就废了。
  深档 +8 的欠行程 8 ± 5mm 要在 25mm 门内，门在 9.9mm 时 30% 组误判 jam(gate_out)。
