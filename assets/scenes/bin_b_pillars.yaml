# 柱阵料箱：工件对称搭在四根方柱顶上，看似压到位、底面实则悬空。
#
# 批跑用它探「误成功」——程序若判成功即严重错误。柱高与柱距的配合（对工件对称搭稳、
# probe 微抬压回停点异常）预期须 HITL 迭代；这里的值是设计起点。
# 位姿、工件挂载与点位同 bin_a_flat，只差 collision。
# contact_solref 0.03 而非 A 的 0.01：MuJoCo 的接触刚度按接触点数叠加，四根柱顶给 16 个接触点、
# 平底只有 4 个，同 solref 下柱顶硬 4 倍（静压 24.9N 穿透 0.035 vs 0.136mm），16mm/s 撞上去
# 力峰 29N 贴 DUT 30N 上限。0.03 实测与平底柔度逐位相同，让 B 测的是几何不是刚度。
