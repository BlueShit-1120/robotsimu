# 钩缘料箱：+x 壁内侧一块水平悬挑板，工件先在板下贴底、微抬时被勾住出法向拉力。
#
# 批跑用它验 DUT 的「抬不动」提前判卡滞分支。工件挂载与点位同 bin_a_flat；料箱比 A 向 −x
# 挪 15mm：σ=0 时工件中心落在 A 箱心（真跑 workpiece_series 反推），+x 面到离本箱心 65mm、
# 离壁 5mm，overhang 8–12 → 整面啮合 3–7mm（啮合只剩偏航角带来的 1–2mm 角接触时，
# 拉力到不了 10N/50ms，勾不住）。板下净空 54mm = 工件高 40mm + 悬空 14mm：挂住时工件
# 底面离底 >10mm，真值判悬空 + 拉力，落「正确拒绝」格而不是 3–10mm 灰带；微抬量在
# accept_c 档抬到 18mm 才够得着板。
#
# 批跑中或跑完在 SCENE 面板保存本预设，会把最后一组采样的 overhang 写回来，保存前先看。
