# PPO hyperparams for M1 Reach (SB3)
algo: PPO
policy: MlpPolicy
total_timesteps: 100000
n_steps: 2048
batch_size: 64
n_epochs: 10
learning_rate: 3.0e-4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5
device: cpu

env:
  phase: reach
  hover_offset: 0.30
  success_dist: 0.05
  delta_q_scale: 0.06
  max_episode_steps: 200
  randomize_box: false
