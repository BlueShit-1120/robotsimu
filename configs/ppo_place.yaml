# PPO hyperparams for M3 Place (SB3) — C2 carry + C3 release
algo: PPO
policy: MlpPolicy
total_timesteps: 300000
n_steps: 2048
batch_size: 64
n_epochs: 10
learning_rate: 3.0e-4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
device: cpu

env:
  phase: place
  hover_offset: 0.06
  lift_height: 0.03
  place_tol_xy: 0.10
  place_tol_z: 0.04
  place_stable_steps: 2
  delta_q_scale: 0.05
  max_episode_steps: 120
  randomize_box: false
  grasp_latch: true
