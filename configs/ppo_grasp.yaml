# PPO hyperparams for M2 Grasp (SB3) — C1 close+lift
algo: PPO
policy: MlpPolicy
total_timesteps: 200000
n_steps: 2048
batch_size: 64
n_epochs: 10
learning_rate: 3.0e-4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
device: cpu

env:
  phase: grasp
  hover_offset: 0.06
  success_dist: 0.05
  lift_height: 0.03
  delta_q_scale: 0.05
  # M4 no-latch contact: prefer delta_q_scale 0.035 + grasp_latch false
  max_episode_steps: 120
  randomize_box: false
  hold_gripper_open: false
