# Task config (right-arm pick-place / reach)
task: pick_place
backend: mujoco
scene: assets/mjcf/pick_place_scene.xml
# curriculum: reach (M1) | pick_place (M0 smoke / later grasp)
phase: reach

control:
  dof: 8  # right arm 7 + gripper 1
  delta_q_scale: 0.05
  control_hz: 50
  frame_skip: 10
  max_episode_steps: 400

reach:  # C0 / M1
  hover_offset_m: 0.30   # short-train default; lower to ~0.08 before grasp
  success_dist_m: 0.05
  hold_gripper_open: true
  randomize_box: false
  max_episode_steps: 250
  delta_q_scale: 0.06

workpiece:
  size_m: [0.05, 0.04, 0.03]  # 5×4×3 cm
  mass_kg: 0.15
  friction_slide: 0.6
  spawn_xy_center: [0.70, -0.20]  # near right-arm home EE
  spawn_xy_half_range: [0.05, 0.06]
  place_goal_xy: [0.70, 0.05]

frozen:
  base: true
  left_arm: true
  head: true
  wheels_steering: true
  torso_lift: 0.5
  waist_pitch: 0.3
