# Conda env pin for MuJoCo path (rs-mujoco). Isaac Lab uses a separate env.
name: rs-mujoco
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24,<3
  - pip:
      - mujoco>=3.1,<4
      - gymnasium>=0.29
      - stable-baselines3>=2.3
      - torch
      - tensorboard
      - -e .
# After create, for CUDA torch instead of the default PyPI/CPU wheel:
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
